name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          cd Tracker
          npm ci

      - name: Build Web Dist
        run: |
          cd Tracker
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd Tracker
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd Tracker/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "const fs=require('fs'); const m=fs.readFileSync('Tracker/src/lib/version.ts','utf8').match(/APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]/); m ? m[1] : '2.4.6'")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          VERSION="${{ steps.get_version.outputs.APP_VERSION }}"
          find Tracker/android -name "*.apk" -exec cp {} release-apk/Spendova_v${VERSION}.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Spendova-Android-APK
          path: release-apk/Spendova_v${{ steps.get_version.outputs.APP_VERSION }}.apk
          retention-days: 1

      - name: Clean Old APKs from v-latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view v-latest --json assets -q '.assets[].name' 2>/dev/null || true)
          for asset in $ASSETS; do
            if [[ "$asset" == *.apk ]]; then
              gh release delete-asset v-latest "$asset" --yes || true
            fi
          done

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v-latest
          name: Spendova Android APK v${{ steps.get_version.outputs.APP_VERSION }}
          body: |
            RELEASE_VERSION=${{ steps.get_version.outputs.APP_VERSION }}
            Automated Android release for Spendova v${{ steps.get_version.outputs.APP_VERSION }}.
            Commit: ${{ github.sha }}
          files: |
            release-apk/Spendova_v${{ steps.get_version.outputs.APP_VERSION }}.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
