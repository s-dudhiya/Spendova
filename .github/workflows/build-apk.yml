name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          cd Tracker
          npm ci

      - name: Build Web Dist
        run: |
          cd Tracker
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd Tracker
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd Tracker/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          find Tracker/android -name "*.apk" -exec cp {} release-apk/Spendova-debug.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Spendova-Android-APK
          path: release-apk/Spendova-debug.apk
          retention-days: 1

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v-latest
          name: Spendova Latest Android APK
          body: |
            Automated Android debug build for Spendova.
            Latest commit: ${{ github.sha }}
          files: release-apk/Spendova-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
